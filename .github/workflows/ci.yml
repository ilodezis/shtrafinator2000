name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: osv-scanner catches new advisories for dependencies that did not change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # The scanner test renders a Cyrillic PDF and needs a font that has the glyphs.
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  osv:
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # requirements.txt holds version ranges, which a scanner can only guess at. Scan what pip
      # actually installs instead.
      - run: |
          pip install -r requirements.txt
          pip freeze > frozen-requirements.txt
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --no-resolve
            -L requirements.txt:frozen-requirements.txt
            -L package-lock.json:frontend/package-lock.json
