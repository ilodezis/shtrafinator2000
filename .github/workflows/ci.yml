name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: picks up new Swift toolchain and runner image changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run tests
        run: swift test

  macos:
    name: Tests and app build (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      # Checks that the SwiftUI app compiles and that the bundle can be assembled.
      - name: Build .app bundle
        run: scripts/build-app.sh
      - name: Zip .app bundle
        run: ditto -c -k --keepParent dist/Shtrafinator_2000.app dist/Shtrafinator_2000.zip
      - name: Upload .app bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Shtrafinator_2000
          path: dist/Shtrafinator_2000.zip
          if-no-files-found: error
