name: Build and Release Application

on:
  push:
    tags:
      - 'v*' # Trigger build when pushing tags (e.g., v1.0.0)
  workflow_dispatch: # Enable manual triggering from GitHub UI

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          # Build as .app bundle (no --onefile — required for proper macOS .app structure)
          pyinstaller --windowed \
            --name "Shtrafinator_2000" \
            --icon "app.icns" \
            --add-data "frontend/dist:frontend/dist" \
            main.py
          codesign --force --deep --sign - "dist/Shtrafinator_2000.app"

      - name: Build macOS PKG Installer
        run: |
          mkdir -p packaging/scripts
          cat << 'EOF' > packaging/scripts/postinstall
          #!/bin/bash
          # Automatically strip quarantine from the installed application
          xattr -cr /Applications/Shtrafinator_2000.app 2>/dev/null || true
          chmod -R 755 /Applications/Shtrafinator_2000.app 2>/dev/null || true
          exit 0
          EOF
          chmod +x packaging/scripts/postinstall

          mkdir -p pkg_root
          cp -R "dist/Shtrafinator_2000.app" pkg_root/

          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.0.3"
          fi

          pkgbuild \
            --root pkg_root \
            --install-location "/Applications" \
            --scripts packaging/scripts \
            --identifier "com.cloudpayments.shtrafinator2000" \
            --version "$VERSION" \
            "Shtrafinator_2000_macOS.pkg"

      - name: Create DMG Disk Image
        run: |
          mkdir dmg_root
          cp -R "dist/Shtrafinator_2000.app" dmg_root/
          hdiutil create -fs HFS+ -srcfolder dmg_root -volname "Shtrafinator 2000" "Shtrafinator_2000_macOS.dmg"

      - name: Upload macOS Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Штрафинатор 2000 ${{ github.ref_name }}"
          body: |
            Автоматическая сборка приложения Штрафинатор 2000.

            ### Как запустить:
            * **macOS (Рекомендуется)**: Скачайте и установите `Shtrafinator_2000_macOS.pkg`. Установщик скопирует программу в «Программы» и автоматически снимет карантин macOS.
            * **macOS (DMG)**: Скачайте и смонтируйте образ `Shtrafinator_2000_macOS.dmg`, затем перетащите приложение в папку «Программы».
            * **Windows**: Скачайте и запустите `Shtrafinator_2000.exe`.
          files: |
            Shtrafinator_2000_macOS.pkg
            Shtrafinator_2000_macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          # Latin name avoids Windows path issues with Cyrillic characters
          pyinstaller --noconsole --onefile \
            --name "Shtrafinator_2000" \
            --icon "app.ico" \
            --add-data "app.ico;." \
            --add-data "frontend/dist;frontend/dist" \
            main.py

      - name: Upload Windows EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Штрафинатор 2000 ${{ github.ref_name }}"
          body: |
            Автоматическая сборка приложения Штрафинатор 2000.

            ### Как запустить:
            * **macOS (Рекомендуется)**: Скачайте и установите `Shtrafinator_2000_macOS.pkg`. Установщик скопирует программу в «Программы» и автоматически снимет карантин macOS.
            * **macOS (DMG)**: Скачайте и смонтируйте образ `Shtrafinator_2000_macOS.dmg`, затем перетащите приложение в папку «Программы».
            * **Windows**: Скачайте и запустите `Shtrafinator_2000.exe`.
          files: dist/Shtrafinator_2000.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
