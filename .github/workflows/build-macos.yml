name: Build and Release macOS App

on:
  push:
    tags:
      - 'v*' # Trigger build when pushing tags (e.g., v2.0.0)
  workflow_dispatch: # Enable manual triggering from GitHub UI

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build app and installer
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # Version comes from the tag (v2.0.0 -> 2.0.0). Manual runs from a branch get the fallback.
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ -z "$VERSION" ]; then
            VERSION="2.0.0"
          fi
          export VERSION
          scripts/build-app.sh --pkg

      - name: Upload macOS PKG to Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: "Штрафинатор 2000 ${{ github.ref_name }}"
          body: |
            Автоматическая сборка приложения Штрафинатор 2000 для macOS 14 и новее (Apple Silicon и Intel).

            ### Как установить:
            1. Скачайте `Shtrafinator_2000_macOS.pkg` и откройте его.
            2. Установщик скопирует программу в «Программы» и автоматически снимет карантин macOS.
            3. Запустите «Штрафинатор 2000» из папки «Программы».
          files: dist/Shtrafinator_2000_macOS.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
